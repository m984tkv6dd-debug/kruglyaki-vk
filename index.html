<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Кругляки</title>
<style>
  html,body{margin:0;height:100%;background:#0d1020;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #code{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;font:bold 40px Verdana,sans-serif;text-align:center;

    width:240px;padding:6px 10px;border-radius:10px;border:2px solid #f5c518;background:#1b1f3a;color:#fff;outline:none;z-index:2}
  #ws{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;width:min(920px,96vw);max-height:94vh;overflow:auto;box-sizing:border-box;
    padding:18px 22px;background:rgba(16,19,40,.97);border:2px solid rgba(255,255,255,.12);border-radius:18px;color:#fff;font:15px Verdana,sans-serif;z-index:3;user-select:text;-webkit-user-select:text}
  #ws h1{margin:0 0 4px;color:#ffe066;font-size:30px} #ws h2{font-size:19px;margin:18px 0 8px;display:flex;align-items:center;gap:12px}

  #ws .empty{color:rgba(255,255,255,.45)} #ws button{font:bold 14px Verdana,sans-serif;padding:8px 12px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
  #ws button:hover{background:rgba(255,255,255,.24)} #ws button.acc{background:#f5c518;color:#1b1b2f} #ws button.del{background:rgba(255,90,90,.25)}
  #ws .row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:rgba(255,255,255,.05);margin:6px 0;flex-wrap:wrap}
  #ws .dot{width:18px;height:18px;border-radius:50%;flex:none} #ws .info{flex:1;min-width:160px} #ws .info small{display:block;color:rgba(255,255,255,.6)}
  #ws .sw{white-space:nowrap} #ws textarea{width:100%;box-sizing:border-box;min-height:64px;border-radius:10px;background:#0b0d1e;color:#fff;border:1px solid rgba(255,255,255,.2);padding:8px;font:13px monospace}
  #ws .imp{display:flex;gap:8px;align-items:flex-start} #ws .bottom{display:flex;gap:10px;margin-top:18px}
  #ws .cardedit{display:flex;gap:20px;flex-wrap:wrap} #ws .preview{width:220px;height:300px;border-radius:16px;padding:16px;box-sizing:border-box;text-align:center;flex:none}
  #ws .preview .ic{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.18);margin:10px auto;font:bold 44px Verdana;line-height:80px}
  #ws .preview b{font-size:20px} #ws .form{flex:1;min-width:260px} #ws .fx{display:flex;align-items:center;gap:10px;margin:6px 0}
  #ws .fx span{width:190px;flex:none} #ws .fx input[type=range]{flex:1} #ws .fx output{width:56px;text-align:right}
  #ws canvas{position:static;transform:none;flex:none} #ws .opts{display:flex;flex-wrap:wrap;gap:8px} #ws .opts button.on{outline:3px solid #f5c518} #ws .swatch{width:38px;height:38px;border-radius:50%;padding:0}
  #ws input[type=text]{flex:1;font:15px Verdana;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:#0b0d1e;color:#fff}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;outline:none}
</style>
<!-- Yandex Games SDK: на хостинге Яндекс Игр файл /sdk.js доступен автоматически. Локально он не загрузится, игра работает без него. -->
<script src="vk-bridge.min.js"></script>
<script src="platform-vk.js"></script>
<!-- PeerJS (WebRTC) для онлайна по коду комнаты, лежит рядом в архиве -->
<script src="peerjs.min.js"></script>
<!-- звуки и музыка (эффекты Kenney, CC0; музыка своя) -->
<script src="sounds.js"></script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="ws"></div>
<input id="aname" maxlength="18" placeholder="Название арены">
<input id="code" maxlength="5" autocomplete="off" spellcheck="false" placeholder="КОД">
<script>
(() => {
'use strict';

// ---------- базовое ----------
const W = 1280, H = 720, G = 1700, WIN_ROUNDS = 5, SUDDEN = 35;
// арены крупнее экрана: мир 1600×900, камера показывает его целиком (шарики относительно арены меньше)
const AW = 1600, AH = 900, DY = AH - H, FY = 680 + DY, AK = AW / W;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let S = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  S = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px';
  cv.width = Math.round(W * S * DPR); cv.height = Math.round(H * S * DPR);
}
addEventListener('resize', resize); resize();

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const wrapA = x => ((x + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
const lerpA = (a, b, t) => a + wrapA(b - a) * t;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ---------- ввод ----------
const keys = new Set(), pressed = new Set();
addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (!keys.has(e.code)) pressed.add(e.code);
  keys.add(e.code);
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','Enter'].includes(e.code)) e.preventDefault();
  audio.unlock();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); mouse.down = false; mouse.right = false; });

const mouse = { x: W / 2, y: H / 2, down: false, right: false, rightPressed: false, clicked: false, used: false };
function toGame(cx, cy) { const r = cv.getBoundingClientRect(); return { x: (cx - r.left) / S, y: (cy - r.top) / S }; }
cv.addEventListener('mousemove', e => { const p = toGame(e.clientX, e.clientY); mouse.x = p.x; mouse.y = p.y; mouse.used = true; });
cv.addEventListener('mousedown', e => {
  audio.unlock(); cv.focus();
  const p = toGame(e.clientX, e.clientY); mouse.x = p.x; mouse.y = p.y; mouse.used = true;
  if (e.button === 0) { mouse.down = true; mouse.clicked = true; }
  if (e.button === 2) { mouse.right = true; mouse.rightPressed = true; }
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; if (e.button === 2) mouse.right = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

// сенсорное управление
let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const TB = {
  left:  { x: 95,   y: 630, r: 58, label: '◀' },
  right: { x: 235,  y: 630, r: 58, label: '▶' },
  jump:  { x: 1175, y: 600, r: 66, label: '▲' },
  block: { x: 1040, y: 650, r: 48, label: '◯' },
  pause: { x: 1236, y: 40,  r: 28, label: 'II' },
};
const touches = new Map(); // id -> {role, x, y}
const touchPressed = new Set();
function touchRole(x, y) {
  for (const k of ['jump','block','pause']) { const b = TB[k]; if (Math.hypot(x - b.x, y - b.y) < b.r + 14) return k; }
  if (x < W * 0.33 && y > H * 0.45) return x < (TB.left.x + TB.right.x) / 2 ? 'left' : 'right';
  return 'aim';
}
function onTouch(e, type) {
  e.preventDefault(); audio.unlock(); isTouch = true;
  for (const t of e.changedTouches) {
    const p = toGame(t.clientX, t.clientY);
    if (game.scene === 'arenaEdit') { mouse.x = p.x; mouse.y = p.y; if (type === 'start') { mouse.down = true; mouse.clicked = true; } else if (type !== 'move') mouse.down = false; continue; }
    if (type === 'start') {
      const role = touchRole(p.x, p.y);
      touches.set(t.identifier, { role, x: p.x, y: p.y });
      touchPressed.add(role);
      mouse.x = p.x; mouse.y = p.y; mouse.clicked = true;
    } else if (type === 'move') {
      const o = touches.get(t.identifier); if (!o) continue;
      o.x = p.x; o.y = p.y;
      if (o.role === 'left' || o.role === 'right') o.role = p.x < (TB.left.x + TB.right.x) / 2 ? 'left' : 'right';
    } else touches.delete(t.identifier);
  }
}
cv.addEventListener('touchstart', e => onTouch(e, 'start'), { passive: false });
cv.addEventListener('touchmove', e => onTouch(e, 'move'), { passive: false });
cv.addEventListener('touchend', e => onTouch(e, 'end'), { passive: false });
cv.addEventListener('touchcancel', e => onTouch(e, 'end'), { passive: false });
function touchState() {
  const s = { left: false, right: false, aim: null };
  for (const t of touches.values()) {
    if (t.role === 'left') s.left = true;
    if (t.role === 'right') s.right = true;
    if (t.role === 'aim') s.aim = t;
  }
  return s;
}

// ---------- звук ----------
const VOLS = [0, .2, .4, .6, .8, 1];
const audio = {
  ctx: null, master: null, sfxBus: null, musBus: null, muted: false, adMute: false, last: {}, buf: {}, music: null,
  vol: (() => { try { const v = JSON.parse(localStorage.getItem('sharoboy_vol') || 'null'); if (v && VOLS.includes(v.s) && VOLS.includes(v.m)) return v; } catch (e) {} return { s: .8, m: .6 }; })(),
  unlock() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
        this.sfxBus = this.ctx.createGain(); this.sfxBus.connect(this.master);
        this.musBus = this.ctx.createGain(); this.musBus.connect(this.master);
        this.setMute(); this.load();
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume();
  },
  load() { // звуки лежат в sounds.js (base64 mp3); если файла нет — остаются синтезированные
    const src = window.KR_SND; if (!src) return;
    for (const k of Object.keys(src)) {
      try {
        const bin = atob(src[k]), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        const done = b => { this.buf[k] = b; if (k === 'music') this.startMusic(); };
        const pr = this.ctx.decodeAudioData(u8.buffer, done, () => {}); if (pr && pr.catch) pr.catch(() => {});
      } catch (e) {}
    }
  },
  startMusic() {
    if (!this.ctx || this.music || !this.buf.music) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.buf.music; s.loop = true;
    s.connect(this.musBus); s.start(); this.music = s;
  },
  setVol(kind, v) { this.vol[kind] = v; try { localStorage.setItem('sharoboy_vol', JSON.stringify(this.vol)); } catch (e) {} this.setMute(); },
  nextVol(kind) { this.setVol(kind, VOLS[(VOLS.indexOf(this.vol[kind]) + 1) % VOLS.length]); if (kind === 's') sfx.shoot(); },
  setMute() {
    if (!this.master) return;
    this.master.gain.value = (this.muted || this.adMute || document.hidden) ? 0 : 1;
    this.sfxBus.gain.value = this.vol.s * .5; this.musBus.gain.value = this.vol.m * .3;
  },
  play(name, vol = 1, rate = 1) { // сэмпл; false — если его нет (тогда играет синтез)
    const b = this.buf[name]; if (!b) return false;
    if (!this.ctx || this.muted || this.adMute) return true;
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
    s.buffer = b; s.playbackRate.value = rate; g.gain.value = vol;
    s.connect(g); g.connect(this.sfxBus); s.start(); return true;
  },
  ok(name, gap) { const t = performance.now(); if (this.last[name] && t - this.last[name] < gap) return false; this.last[name] = t; return true; },
  tone(f, dur, type = 'square', vol = .2, slide = 1) {
    if (!this.ctx || this.muted || this.adMute) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.sfxBus); o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol = .3, freq = 1000) {
    if (!this.ctx || this.muted || this.adMute) return;
    const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .8; g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.sfxBus); src.start();
  },
};
const sfx = {
  shoot() { if (audio.ok('shoot', 40) && !audio.play('shot', .55, rnd(.94, 1.08))) audio.tone(rnd(480, 560), .08, 'square', .09, .45); },
  hit()   { if (!audio.play('hit', .9, rnd(.92, 1.08))) { audio.noise(.12, .35, 900); audio.tone(200, .12, 'sawtooth', .12, .5); } },
  jump()  { if (audio.ok('jump', 60) && !audio.play('jump', .35, rnd(.95, 1.1))) audio.tone(320, .1, 'sine', .14, 1.9); },
  block() { audio.tone(950, .16, 'triangle', .18, .55); },
  bounce(){ if (audio.ok('bnc', 50)) audio.tone(700, .05, 'sine', .08, 1.4); },
  boom()  { if (audio.ok('boom', 50) && !audio.play('boom', 1, rnd(.9, 1.05))) audio.noise(.4, .5, 260); },
  die()   { if (!audio.play('die', .8)) { audio.noise(.5, .45, 500); audio.tone(400, .45, 'sawtooth', .15, .2); } },
  tick()  { audio.tone(660, .09, 'sine', .14); },
  go()    { audio.tone(990, .2, 'square', .12); },
  card()  { audio.tone(520, .08, 'triangle', .15); setTimeout(() => audio.tone(780, .12, 'triangle', .15), 70); },
  win()   { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => audio.tone(f, .2, 'triangle', .16), i * 110)); },
};
for (const k of Object.keys(sfx)) { const f = sfx[k]; sfx[k] = (...a) => { if (net.role === 'host' && k !== 'tick') net.ev.push(['s', k]); f(...a); }; }
const net = { role: null, peer: null, conn: null, code: '', status: '', ev: [], lastSend: 0, acc: { j: false, b: false }, pickSent: false, lv: -1, guests: [], started: false, me: 0, fillBots: false, notice: null };
document.addEventListener('visibilitychange', () => {
  audio.setMute();
  if (audio.ctx) { document.hidden ? audio.ctx.suspend() : audio.ctx.resume(); }
  if (document.hidden && game.scene === 'game') game.paused = true;
});

// ---------- Yandex Games SDK ----------
const YA = {
  sdk: null, gp: false,
  async init() {
    try {
      if (window.YaGames) {
        this.sdk = await window.YaGames.init();
        this.sdk.on && this.sdk.on('game_api_pause', () => { game.sdkPause = true; audio.adMute = true; audio.setMute(); });
        this.sdk.on && this.sdk.on('game_api_resume', () => { game.sdkPause = false; audio.adMute = false; audio.setMute(); });
      }
    } catch (e) { console.warn('Yandex SDK недоступен', e); }
    try { this.sdk && this.sdk.features.LoadingAPI.ready(); } catch (e) {}
  },
  setGameplay(on) {
    if (on === this.gp) return; this.gp = on;
    try { if (this.sdk) on ? this.sdk.features.GameplayAPI.start() : this.sdk.features.GameplayAPI.stop(); } catch (e) {}
  },
  // реклама не чаще раза в 3 минуты и не раньше чем через 3 минуты после запуска
  adGap: 180000, lastAd: performance.now(),
  showAd(cb) {
    if (!this.sdk || performance.now() - this.lastAd < this.adGap) { cb(); return; }
    this.lastAd = performance.now();
    let done = false;
    const fin = () => { if (done) return; done = true; audio.adMute = false; audio.setMute(); game.sdkPause = false; cb(); };
    try {
      this.sdk.adv.showFullscreenAdv({ callbacks: {
        onOpen: () => { audio.adMute = true; audio.setMute(); game.sdkPause = true; },
        onClose: fin, onError: fin, onOffline: fin,
      } });
    } catch (e) { fin(); }
  },
  // реклама за награду (по желанию игрока): есть только там, где площадка её умеет
  canReward() { return !!(this.sdk && this.sdk.adv && this.sdk.adv.showRewardedVideo); },
  showReward(onReward) {
    if (!this.canReward()) return;
    let done = false, got = false;
    const fin = () => { if (done) return; done = true; audio.adMute = false; audio.setMute(); game.sdkPause = false; if (got) onReward(); };
    try {
      this.sdk.adv.showRewardedVideo({ callbacks: {
        onOpen: () => { audio.adMute = true; audio.setMute(); game.sdkPause = true; },
        onRewarded: () => { got = true; },
        onClose: fin, onError: fin,
      } });
    } catch (e) { fin(); }
  },
};

// ---------- карты улучшений ----------
function baseStats() {
  return { dmg: 22, fireDelay: .32, reload: 1.3, ammo: 3, bSpeed: 950, bR: 4.5, bGrav: 700, bounces: 0, count: 1,
    spread: .14, lifesteal: 0, explode: 0, homing: 0, knock: 1, speed: 380, jump: 640, airJumps: 1,
    blockCd: 3.2, thorns: 0, regen: 0, ghost: false, rocket: 0, size: 1, hpMul: 1,
    slow: 0, poison: 0, pierce: 0, split: 0, blink: 0, reflect: false, last: false, grow: 0, recoil: 0, blockHeal: 0, burst: 0,
    edgeImmune: false, armor: 0, blockDur: .22, wave: false, martyr: false, refund: false, dmgTaken: 1 };
}
const CARDS = [
  { id: 'heavy',  name: 'Тяжёлый калибр', col: '#e0574f', desc: '+70% урона. Пули крупнее и медленнее, перезарядка дольше.', apply: s => { s.dmg *= 1.7; s.bSpeed *= .8; s.reload += .3; s.bR *= 1.25; } },
  { id: 'mg',     name: 'Пулемётчик',     col: '#f0a53a', desc: 'Стреляешь вдвое чаще, +2 патрона, но −35% урона.', apply: s => { s.fireDelay *= .5; s.ammo += 2; s.dmg *= .65; } },
  { id: 'bounce', name: 'Попрыгунчик',    col: '#55c3f0', desc: 'Пули отскакивают от стен ещё 2 раза.', apply: s => { s.bounces += 2; } },
  { id: 'fan',    name: 'Веер',           col: '#f07ab8', desc: '+2 пули за выстрел веером, −40% урона каждой.', apply: s => { s.count += 2; s.dmg *= .6; s.spread += .05; } },
  { id: 'donut',  name: 'Пончик',         col: '#c98a5a', desc: '+60% здоровья, но шарик крупнее и чуть медленнее.', apply: s => { s.hpMul *= 1.6; s.size *= 1.2; s.speed *= .94; } },
  { id: 'leech',  name: 'Кровопийца',     col: '#b63a5a', desc: 'Возвращает тебе 35% нанесённого урона.', apply: s => { s.lifesteal += .35; } },
  { id: 'pop',    name: 'Хлопушка',       col: '#ff7b2e', desc: 'Пули взрываются при попадании (радиус 75).', apply: s => { s.explode += 75; s.dmg *= .85; } },
  { id: 'sniff',  name: 'Нюхач',          col: '#8fd14f', desc: 'Пули сами поворачивают к врагу, которого видят.', apply: s => { s.homing += 1.3; s.bSpeed *= .85; } },
  { id: 'spring', name: 'Пружинка',       col: '#7be0c3', desc: '+1 прыжок в воздухе и прыжки на 15% выше.', apply: s => { s.airJumps += 1; s.jump *= 1.15; } },
  { id: 'mag',    name: 'Запасливый',     col: '#d6c35a', desc: '+3 патрона и перезарядка на 25% быстрее.', apply: s => { s.ammo += 3; s.reload *= .75; } },
  { id: 'sniper', name: 'Снайпер',        col: '#9aa7ff', desc: 'Пули в 1,7 раза быстрее, почти не падают, +25% урона.', apply: s => { s.bSpeed *= 1.7; s.bGrav *= .3; s.dmg *= 1.25; s.fireDelay *= 1.15; } },
  { id: 'hedge',  name: 'Ёжик',           col: '#a0763f', desc: 'Щит выпускает 8 пуль во все стороны. Перезарядка щита +0,8 с.', apply: s => { s.thorns += 8; s.blockCd += .8; } },

const FXK = Object.fromEntries(FX.map(f => [f.k, f]));
const escHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtNum = v => (Math.round(v * 10) / 10).toString().replace('.', ',');
function fxText(f, v) {
  if (f.u === 'bool') return f.label;
  return `${f.label} ${v > 0 ? '+' : ''}${fmtNum(v)}${f.u === '%' ? '%' : ''}`;
}
function describeFx(fx) { const out = []; for (const f of FX) { const v = fx[f.k]; if (v) out.push(fxText(f, v)); } return out.length ? out.join(', ') + '.' : 'Пока без эффектов.'; }
function cleanName(s, def) { s = String(s || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 18); return s || def; }
function sanitizeCard(d) {
  if (!d || typeof d !== 'object') return null;
  const fx = {};
  for (const f of FX) {
    let v = Number(d.fx && d.fx[f.k]);
    if (!isFinite(v) || !v) continue;
    v = clamp(Math.round(v / f.step) * f.step, f.min, f.max);
    if (v) fx[f.k] = f.u === 'bool' ? 1 : v;

  const id = /^u[a-z0-9]{4,12}$/.test(d.id) ? d.id : 'u' + Math.random().toString(36).slice(2, 10);
  return { id, name: cleanName(d.name, 'Моя карта'), col: /^#[0-9a-f]{6}$/i.test(d.col) ? d.col : '#7aa2ff', fx, on: d.on !== false };
}
function sanitizeArena(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.rects)) return null;
  const rects = [];
  for (const r of d.rects.slice(0, 40)) {
    if (!Array.isArray(r) || r.length < 4) continue;
    const [x, y, w, h] = r.map(Number);
    if (![x, y, w, h].every(isFinite)) continue;
    rects.push([clamp(Math.round(x), -20, 1290), clamp(Math.round(y), 40, 715), clamp(Math.round(w), 10, 1320), clamp(Math.round(h), 10, 700)]);
  }
  if (!rects.length) return null;
  const sp = Array.isArray(d.spawns) ? d.spawns : [];
  const spawns = [0, 1, 2, 3].map(i => { const s = sp[i] || sp[i % 2] || [200 + i * 300, 300]; return [clamp(Math.round(+s[0] || 0), 30, 1250), clamp(Math.round(+s[1] || 0), 40, 690)]; });
  const PT = ['barrel', 'crate', 'saw', 'roll', 'swing'];
  const props = (Array.isArray(d.props) ? d.props : []).slice(0, 20).filter(q => Array.isArray(q) && PT.includes(q[0]) && isFinite(+q[1]) && isFinite(+q[2]))
    .map(([t, x, y]) => [t, clamp(Math.round(+x), 20, 1260), clamp(Math.round(+y), t === 'swing' ? 120 : 20, t === 'swing' ? 420 : 700)]);
  const id = /^a[a-z0-9]{4,12}$/.test(d.id) ? d.id : 'a' + Math.random().toString(36).slice(2, 10);
  return { id, name: cleanName(d.name, 'Моя арена'), theme: clamp(Math.floor(+d.theme || 0), 0, LEVELS.length - 1), rects, spawns, props, on: d.on !== false };
}
function makeCard(d) {
  return { id: d.id, name: d.name, col: d.col, desc: describeFx(d.fx), custom: true, unique: false,
    apply: s => { for (const k in d.fx) if (FXK[k]) FXK[k].ap(s, d.fx[k]); } };
}
function arenaLevel(d) {
  const t = LEVELS[d.theme] || LEVELS[0];
  return { name: d.name, sky: t.sky, plat: t.plat, top: t.top, rects: d.rects, spawns: d.spawns, props: d.props || [], custom: true };
}
const store = {

};

const extraCards = new Map(); // карты, пришедшие от хоста в онлайне

// коды обмена: SB1C. / SB1A. + base64 от JSON
function b64e(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64d(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function exportCode(kind, d) {
  const o = kind === 'C' ? { name: d.name, col: d.col, fx: d.fx } : { name: d.name, theme: d.theme, rects: d.rects, spawns: d.spawns, props: d.props || [] };
  return 'SB1' + kind + '.' + b64e(JSON.stringify(o));
}
function importCode(code) {

  if (!m || code.length > 6000) return { err: 'Это не код карты или арены' };
  let o; try { o = JSON.parse(b64d(m[2])); } catch (e) { return { err: 'Код повреждён' }; }
  delete o.id;
  if (m[1] === 'C') { const c = sanitizeCard(o); if (!c) return { err: 'Код повреждён' }; store.cards.push(c); store.save(); return { ok: 'Карта «' + c.name + '» добавлена' }; }
  const a = sanitizeArena(o); if (!a) return { err: 'Код повреждён' }; store.arenas.push(a); store.save(); return { ok: 'Арена «' + a.name + '» добавлена' };
}

// ---------- онлайн по коду комнаты: хост и до 3 гостей (WebRTC через PeerJS) ----------
const codeEl = document.getElementById('code');
const PEER_PREFIX = 'sharoboy-v2-';

  // ?peer=host:port — свой сервер знакомства (для тестов), иначе бесплатный облачный PeerJS

}

}
codeEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); netJoin(codeEl.value); } });
function genCode() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }

}

}

  game.lobby = 'host';
  const peer = net.peer = new Peer(PEER_PREFIX + net.code, peerOpts());
  peer.on('open', () => { net.status = 'Ждём друзей (до 3). Отправь им этот код'; });
  peer.on('connection', c => {
    if (net.started || net.guests.length >= 3) { c.on('open', () => { safeSend(c, { t: 'full' }); setTimeout(() => c.close(), 400); }); return; }
    const g = { conn: c, look: null, ready: false, lastRecv: performance.now(), player: null };
    net.guests.push(g);
    c.on('open', () => { g.ready = true; g.lastRecv = performance.now(); });
    c.on('data', m => onHostData(g, m));
    c.on('close', () => dropGuest(g)); c.on('error', () => dropGuest(g));

  netClose(); codeInput(false);
  game.lobby = 'joining'; net.code = code; net.status = 'Подключаемся к комнате ' + code + '…';
  const peer = net.peer = new Peer(peerOpts());
  peer.on('open', () => {
    const c = net.conn = peer.connect(PEER_PREFIX + code, { serialization: 'json' });
    c.on('open', () => {
      net.role = 'guest'; net.lastRecv = performance.now(); game.lobby = 'waiting';
      net.send = m => safeSend(c, m);
